<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost in transit · Tailmux</title>
<style>
:root{color-scheme:dark;--ink:#e9eddc;--muted:#a4ad9a;--green:#c9f582;--bg:#151c18;--line:#374338}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Avenir Next",Avenir,sans-serif;min-height:100svh}
main{max-width:1120px;margin:auto;padding:36px 40px}
header,footer{display:flex;justify-content:space-between;align-items:center;gap:20px;font:12px "SFMono-Regular",Consolas,monospace;letter-spacing:.08em}
.brand{color:var(--green);font-weight:800;font-size:16px}.tag{color:var(--muted)}
.scene{display:grid;grid-template-columns:1.2fr 1fr;align-items:center;gap:50px;padding:100px 0 80px}
.eyebrow{font:12px "SFMono-Regular",Consolas,monospace;letter-spacing:.13em;color:var(--green);text-transform:uppercase}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(48px,6vw,78px);font-weight:400;line-height:1.03;letter-spacing:-.055em;margin:22px 0}
h1 em{color:var(--green);font-weight:400}
p{font-size:17px;line-height:1.7;color:var(--muted);max-width:420px}
.destination{margin-top:30px;border-left:2px solid var(--green);padding:8px 16px}
.destination small{display:block;font:10px monospace;color:var(--muted);letter-spacing:.12em;margin-bottom:8px}
.destination code{font-size:15px;overflow-wrap:anywhere}
.art{position:relative;aspect-ratio:1;display:grid;place-items:center;background:radial-gradient(ellipse at center,#27382a 0,transparent 68%)}
svg{width:100%;height:auto;overflow:visible}.parcel{animation:bob 4s ease-in-out infinite;transform-origin:center}
@keyframes bob{50%{transform:translateY(-9px) rotate(-2deg)}}
.recovery{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:28px 0;display:grid;grid-template-columns:1fr 1.2fr;gap:40px}
h2{font-size:17px;margin:0 0 8px;font-weight:600}.recovery p{font-size:14px;margin:0}
.command{background:#0e1511;border:1px solid var(--line);border-radius:8px;padding:18px 20px;font:15px monospace;user-select:all}.prompt{color:var(--green);user-select:none}
.actions{display:flex;align-items:center;gap:22px;margin-top:18px;font-size:13px}
a{color:var(--green);text-underline-offset:5px}a:focus-visible{outline:2px solid var(--green);outline-offset:6px}
.retry{display:inline-block;background:var(--green);color:#172018;padding:11px 18px;border-radius:5px;text-decoration:none;font-weight:700}
footer{color:var(--muted);margin-top:28px;font-size:10px;letter-spacing:.03em}
@media(prefers-reduced-motion:reduce){.parcel{animation:none}}
@media(max-width:700px){main{padding:24px}.scene{grid-template-columns:1fr;padding:50px 0 36px;gap:12px}.art{max-width:270px;margin:auto;order:-1}.recovery{grid-template-columns:1fr;gap:20px}.tag{font-size:10px}footer{align-items:flex-start}h1{margin-top:14px}}
</style>
</head>
<body><main>
<header><span class="brand">↗ TAILMUX</span><span class="tag">LOCAL DELIVERY SERVICE</span></header>
<section class="scene">
<div><div class="eyebrow">{{.Code}} / {{.Label}}</div>
<h1>{{.Heading}}<br><em>{{.Punchline}}</em></h1>
<p>{{.Description}}</p>
<div class="destination"><small>LOOKING FOR</small><code>{{.Host}}</code></div></div>
<div class="art">
<svg viewBox="0 0 400 400" role="img" aria-label="A little lost parcel with a question mark, waiting beside a disconnected route">
<g fill="none" stroke="#53664d" stroke-width="2" stroke-dasharray="4 9"><path d="M10 265 C70 185 75 330 145 310 S245 230 350 300"/><circle cx="210" cy="204" r="155"/></g>
<ellipse cx="210" cy="310" rx="75" ry="12" fill="#0d1510"/>
<g class="parcel" stroke="#18251a" stroke-width="3" stroke-linejoin="round">
<path d="M115 162 206 120 291 164 200 211Z" fill="#e0b886"/>
<path d="M115 162 200 211 200 303 115 252Z" fill="#b88c5e"/>
<path d="M200 211 291 164 291 253 200 303Z" fill="#d7a775"/>
<path d="M150 146 240 191 258 182 169 137Z" fill="#f1d9b5"/>
<path d="M240 191 258 182 258 215 240 226Z" fill="#f1d9b5"/>
<rect x="218" y="233" width="52" height="29" rx="3" fill="#eef0d8" transform="rotate(-27 244 248)"/>
<path d="m225 248 29-15m-25 21 21-11" stroke="#52664b" stroke-width="2"/>
<ellipse cx="140" cy="209" rx="4" ry="6" fill="#18251a"/><ellipse cx="173" cy="228" rx="4" ry="6" fill="#18251a"/>
<path d="m145 244 15 8" fill="none" stroke-linecap="round"/>
</g>
<g fill="#c9f582"><circle cx="312" cy="106" r="28"/><text x="312" y="117" fill="#18251a" text-anchor="middle" font-family="Georgia,serif" font-size="34">?</text></g>
<path d="m64 146 12 5-12 5m270 92 12 5-12 5" fill="none" stroke="#c9f582" stroke-width="2"/>
</svg></div>
</section>
<section class="recovery"><div><h2>{{.RecoveryTitle}}</h2><p>{{.Recovery}}</p></div><div>
<div class="command"><span class="prompt">$ </span>tailmux</div>
<div class="actions"><a class="retry" href="/">Try this address again ↗</a><span>CLI: <code>tailmux forwards</code></span></div>
</div></section>
<footer><span>Your boxes. One workspace.</span><span>Tailmux routing error · the remote app wasn’t reached</span></footer>
</main></body></html>
