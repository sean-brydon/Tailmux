name: Release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./... && go vet ./...
      - run: python3 scripts/test-installer.py
      - name: Build release archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/build-release.sh "$RELEASE_TAG"
      - name: Publish release with installer and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.tar.gz dist/install.sh dist/checksums.txt --verify-tag --generate-notes --title "Tailmux $RELEASE_TAG"
